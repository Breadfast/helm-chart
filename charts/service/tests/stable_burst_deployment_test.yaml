suite: stableBurst deployments
templates:
  - deployment.yaml
set:
  fullnameOverride: svc
  image: {repository: nginx, tag: stable}
  nodeSelectorLabels: {cloud.google.com/compute-class: class-c}
  autoscaling: {enabled: true, minReplicas: 4, maxReplicas: 12}
tests:
  - it: renders a single untouched Deployment when stableBurst is disabled
    asserts:
      - hasDocuments: {count: 1}
      - notExists: {path: spec.template.spec.affinity.nodeAffinity}
      - notExists: {path: spec.template.spec.priorityClassName}
      - notExists: {path: spec.replicas}

  - it: renders a stable and a burst Deployment when enabled
    set:
      stableBurst: {enabled: true, priorityClassName: prod-baseline}
    asserts:
      - hasDocuments: {count: 2}
      - equal: {path: metadata.name, value: svc}
        documentIndex: 0
      - equal: {path: metadata.name, value: svc-burst}
        documentIndex: 1

  - it: stable Deployment has fixed replicas, priority and a preferred on-demand affinity
    set:
      stableBurst: {enabled: true, priorityClassName: prod-baseline-critical}
    documentIndex: 0
    asserts:
      - equal: {path: spec.replicas, value: 4}
      - equal: {path: spec.template.spec.priorityClassName, value: prod-baseline-critical}
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].preference.matchExpressions[0]
          value: {key: cloud.google.com/gke-provisioning, operator: In, values: ["standard"]}
      - notExists: {path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution}
      - equal: {path: spec.selector.matchLabels, value: {app.kubernetes.io/name: service}}

  - it: onDemand required makes the on-demand affinity a hard requirement
    set:
      stableBurst: {enabled: true, priorityClassName: prod-baseline, onDemand: required}
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: cloud.google.com/gke-provisioning
      - notExists: {path: spec.template.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution}

  - it: stableReplicas overrides the autoscaler minimum
    set:
      stableBurst: {enabled: true, priorityClassName: prod-baseline, stableReplicas: 3}
    documentIndex: 0
    asserts:
      - equal: {path: spec.replicas, value: 3}

  - it: burst Deployment is spot only, spread strictly and has no fixed replicas
    set:
      stableBurst: {enabled: true, priorityClassName: prod-baseline}
    documentIndex: 1
    asserts:
      - notExists: {path: spec.replicas}
      - equal:
          path: spec.template.spec.nodeSelector
          value: {cloud.google.com/compute-class: class-c, cloud.google.com/gke-spot: "true"}
      - equal: {path: spec.selector.matchLabels, value: {app.kubernetes.io/name: service, app.kubernetes.io/component: burst}}
      - equal: {path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: burst}
      - equal: {path: 'spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable', value: DoNotSchedule}
      - equal: {path: 'spec.template.spec.topologySpreadConstraints[0].topologyKey', value: kubernetes.io/hostname}
      - notExists: {path: spec.template.spec.priorityClassName}
      - notExists: {path: spec.template.spec.affinity.nodeAffinity}
