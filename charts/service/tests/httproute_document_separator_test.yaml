suite: HTTPRoute document separators
templates:
  - httproute.yaml
values:
  - fixtures/multi-route-values.yaml
tests:
  - it: renders each chunk and hostname as a separate route
    asserts:
      - hasDocuments: {count: 3}
      - equal: {path: metadata.name, value: separator-test-httproute-0-0}
        documentIndex: 0
      - equal: {path: 'spec.hostnames[0]', value: first.example.test}
        documentIndex: 0
      - equal: {path: metadata.name, value: separator-test-httproute-0-1}
        documentIndex: 1
      - equal: {path: 'spec.hostnames[0]', value: first.example.test}
        documentIndex: 1
      - equal: {path: metadata.name, value: separator-test-httproute-1-0}
        documentIndex: 2
      - equal: {path: 'spec.hostnames[0]', value: second.example.test}
        documentIndex: 2

  - it: keeps redirect-only routes free of backend references
    documentIndex: 1
    asserts:
      - equal: {path: 'spec.rules[0].filters[0].type', value: RequestRedirect}
      - notExists: {path: 'spec.rules[0].backendRefs'}

  - it: renders one route when one host has one path
    set:
      gateway:
        hosts:
          - host: first.example.test
            paths:
              - path: /one
                pathType: Prefix
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: metadata.name, value: separator-test-httproute-0-0}

  - it: renders no route when Gateway is disabled
    set:
      gateway:
        enabled: false
    asserts:
      - hasDocuments: {count: 0}
