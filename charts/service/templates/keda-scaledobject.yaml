{{- if .Values.keda.enabled }}
{{- if not .Values.keda.triggers }}
{{- fail "keda.enabled requires at least one entry in keda.triggers; a ScaledObject with no triggers is rejected by the KEDA CRD." }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
  {{- if .Values.argorollouts.enabled }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
  {{- else}}
    apiVersion: apps/v1
    kind: Deployment
  {{- end}}
    name: {{ include "service.fullname" . }}
  {{- if hasKey .Values.keda "minReplicaCount" }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  {{- end }}
  {{- if hasKey .Values.keda "maxReplicaCount" }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  {{- end }}
  {{- if hasKey .Values.keda "pollingInterval" }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  {{- end }}
  {{- if hasKey .Values.keda "cooldownPeriod" }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  {{- end }}
  triggers:
    {{- toYaml .Values.keda.triggers | nindent 4 }}
  {{- /*
  Scaling behavior. KEDA drives the workload through an HPA it owns, and that HPA gets
  Kubernetes' stock behavior unless we say otherwise - scale down up to 100% at once
  after the 300s stabilization window. The chart's own HPA instead drains one pod per
  120s, so without this block a service would silently change scaling dynamics the
  moment it flipped keda.enabled. The shared helper renders the same body for both.
  keda.advanced is merged over the result, so a service can add scalingModifiers or
  restoreToOriginalReplicaCount without losing the default behavior, and an explicit
  behavior inside keda.advanced replaces it outright.
  */}}
  {{- $advanced := deepCopy (.Values.keda.advanced | default dict) }}
  {{- $hpaConfig := deepCopy (get $advanced "horizontalPodAutoscalerConfig" | default dict) }}
  {{- if not (hasKey $hpaConfig "behavior") }}
    {{- $behavior := fromYaml (include "service.autoscalingBehavior" (dict "scaledownStabilization" .Values.keda.scaledownStabilization "podsIncrease" .Values.keda.podsIncrease)) }}
    {{- $_ := set $hpaConfig "behavior" $behavior }}
  {{- end }}
  {{- $_ := set $advanced "horizontalPodAutoscalerConfig" $hpaConfig }}
  advanced:
    {{- toYaml $advanced | nindent 4 }}
{{- end }}
