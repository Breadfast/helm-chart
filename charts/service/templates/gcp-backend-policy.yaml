{{- if and .Values.gateway.enabled .Values.gateway.backendPolicy .Values.gateway.backendPolicy.enabled -}}
{{- $fullName := include "service.fullname" . -}}
{{- $bp := .Values.gateway.backendPolicy -}}
{{- $svcName := $bp.serviceName | default (printf "%s-service" $fullName) -}}
{{- $iapEnabled := and $bp.iap $bp.iap.enabled -}}
{{- $draining := $bp.connectionDraining | default dict -}}
{{- $drainingSet := hasKey $draining "drainingTimeoutSec" -}}
{{- $needSecurityPolicy := not (or $iapEnabled $drainingSet) -}}
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ $fullName }}-backendpolicy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  default:
    {{- if hasKey $bp "timeoutSec" }}
    timeoutSec: {{ $bp.timeoutSec }}
    {{- end }}
    {{- if $needSecurityPolicy }}
    securityPolicy: {{ required "gateway.backendPolicy.securityPolicy is required when gateway.backendPolicy.enabled is true unless iap.enabled or connectionDraining.drainingTimeoutSec is set" $bp.securityPolicy | quote }}
    {{- else }}
    {{- with $bp.securityPolicy }}
    securityPolicy: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- if $iapEnabled }}
    iap:
      {{- toYaml $bp.iap | nindent 6 }}
    {{- end }}
    {{- if $drainingSet }}
    connectionDraining:
      drainingTimeoutSec: {{ $draining.drainingTimeoutSec }}
    {{- end }}
    {{- with $bp.logging }}
    logging:
      enabled: {{ .enabled }}
      {{- if hasKey . "sampleRate" }}
      sampleRate: {{ .sampleRate }}
      {{- end }}
    {{- end }}
  targetRef:
    group: ""
    kind: Service
    name: {{ $svcName }}
{{- end }}
