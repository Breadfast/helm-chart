{{ if .Values.cronJob.create }}
{{ range .Values.cronJob.crons }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}
  labels:
  {{- include "service.labels" $ | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  {{- with .concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  jobTemplate:
    spec:
      template:
        # metadata is emitted unconditionally: the pod template MUST carry
        # app.kubernetes.io/name or GKE cost allocation cannot attribute these pods to a
        # workload, and they land in "[Charges for other usage]" in the Billing report.
        # (Previously this block only rendered when .annotations was set, so every CronJob
        # pod from this chart was unlabelled.) Mirrors the Deployment pod template, which
        # uses the same selectorLabels helper.
        metadata:
          labels:
            {{- include "service.selectorLabels" $ | nindent 12 }}
          {{- with .annotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          {{- with .serviceAccount }}
          serviceAccountName: {{ . }}
          {{- end }}
          containers:
          {{- toYaml .containers | nindent 12 }}
          restartPolicy: {{ .restartPolicy }}
          {{- with $.Values.nodeSelectorLabels }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.nodeTolerations }}
          tolerations:
            {{- toYaml . | nindent 10}}
          {{- end }}
---          
{{ end }}
{{ end }}
